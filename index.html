<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f17;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        .glow-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 46, 99, 0.15);
            filter: blur(90px);
            border-radius: 50%;
            top: 20%;
            left: 20%;
        }

        .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 225, 255, 0.1);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 20%;
            right: 20%;
        }

        /* Main Container */
        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Lock Icon Styling */
        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: rgba(255, 46, 99, 0.1);
            border: 2px solid rgba(255, 46, 99, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 46, 99, 0.2);
        }

        .icon-box svg {
            width: 40px;
            height: 40px;
            fill: #ff2e63;
        }

        /* Titles & Text */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 1.2rem;
            color: #ff2e63;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        p {
            color: #a0a5b5;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Action Button */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff2e63, #ff0055);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 46, 99, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 46, 99, 0.4);
            background: linear-gradient(135deg, #ff0055, #ff2e63);
        }

        /* Keyframes */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Background Glow Elements -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- UI Container -->
    <div class="container">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>
        
        <h1>Site Blocked</h1>
        <div class="sub-title">Good Bye</div>
        
        <p>This page or resource is currently unavailable or access has been restricted. Please contact the administrator if you believe this is an error.</p>
        
        <a href="#" onclick="window.history.back(); return false;" class="btn">Go Back</a>
    </div>

</body>
</html>
